<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0d">
<title>Progress Flight</title>
<style>
  :root { color-scheme: dark; --bg:#090a0d; --panel:#12151b; --muted:#8b929e; --line:#343b46; --accent:#e8edf4; --widget-bg:#171b22; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:18px;
    background:radial-gradient(ellipse at 50% 0%, #202631 0%, #101319 42%, var(--bg) 78%);
    color:#f3f5f8; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .widget { width:min(680px,100%); padding:25px 24px 20px; border:1px solid #ffffff18; border-radius:22px;
    background:linear-gradient(145deg,color-mix(in srgb,var(--widget-bg) 94%,white),color-mix(in srgb,var(--widget-bg) 72%,black)); box-shadow:0 22px 70px #0009; }
  .top {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  margin-bottom:23px;
}

.color-picker {
  justify-self:start;
}

.remaining {
  justify-self:center;
  color:#cbd3de;
  font-size:13px;
  font-weight:500;
  letter-spacing:.02em;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

.edit-toggle {
  justify-self:end;
}
  .top-actions { display:flex; align-items:center; gap:10px; }
  .color-picker { position:relative; display:block; flex:0 0 22px; width:22px; height:22px; padding:0; border:1px solid #ffffff65; border-radius:50%; cursor:pointer;
    background-color:#08090b; background-image:conic-gradient(#111 0 25%,#777 0 50%,#222 0 75%,#aaa 0); background-size:6px 6px;
    box-shadow:0 0 0 2px #ffffff12; image-rendering:pixelated; overflow:hidden; }
  .color-picker input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
  .edit-toggle {
  border:none;
  background:transparent;
  color:#cbd3de;
  padding:0;
  font:500 25px/1 Inter,ui-sans-serif,system-ui,sans-serif;
  cursor:pointer;
  display:grid;
  place-items:center;
}

.edit-toggle:hover {
  color:#ffffff;
}
.edit-toggle:hover { background:#ffffff14; }
  .eyebrow { color:#9ca5b2; font-size:11px; letter-spacing:.19em; text-transform:uppercase; }
  .track-wrap { position:relative; padding:18px 8px 13px; }
  .track { height:5px; background:#353c47; border-radius:99px; position:relative; overflow:visible; }
  .fill { height:100%; width:0%; border-radius:99px; position:relative; background:linear-gradient(90deg,#aeb9c8,#f4f6fa); box-shadow:0 0 14px #dce5f455; transition:width .25s ease; }
  .ends { display:flex; justify-content:space-between; align-items:center; margin-top:-3px; }
  .endpoint { width:48px; height:48px; border-radius:50%; background:#e8ebef; color:#11151b; display:grid; place-items:center; box-shadow:0 4px 18px #0006; }
  .endpoint svg { width:35px; height:35px; }
  .plane svg { width:29px; height:29px; }
  .metrics { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:18px 2px 22px; }
  .result { font-size:clamp(28px,6vw,40px); font-weight:650; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
  .percent { color:#b5bfcc; font-size:14px; font-variant-numeric:tabular-nums; }
  .editor { display:none; margin-top:20px; padding-top:18px; border-top:1px solid #ffffff16; }
  .editor.open { display:block; }
  .fields { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:10px; }
  label { display:block; color:#aab3bf; font-size:11px; margin:0 0 7px 2px; letter-spacing:.04em; }
  input { width:100%; min-width:0; background:#090c11; border:1px solid #303844; border-radius:11px; color:#f4f6f8;
    padding:12px 11px; font:500 15px ui-monospace,SFMono-Regular,Consolas,monospace; outline:none; }
  input:focus { border-color:#aab8ca; box-shadow:0 0 0 3px #aab8ca20; }
  
  @media(max-width:430px) { .widget{padding:20px 17px 17px}.fields{grid-template-columns:1fr 1fr}.fields .value-field{grid-column:1/-1}.endpoint{width:43px;height:43px} }
</style>
</head>
<body>
<main class="widget" aria-label="Progress tracker">
  
  <div class="top">
  <label class="color-picker" title="Choose background colour" aria-label="Choose background colour">
    <input id="backgroundColor" type="color" value="#171b22" aria-label="Background colour">
  </label>

  <div class="remaining" id="remaining">854 km to go</div>

  <button class="edit-toggle" id="editToggle" type="button"
    aria-expanded="false" aria-label="Show more" title="Show more">⌄</button>
</div>

  <div class="track-wrap">
    <div class="track" aria-label="Progress">

    </div>
  </div>

    </div>
  </div>

  <div style="height:10px"></div>

  <section class="editor" id="editor" aria-label="Edit tracker values">
  <div class="fields">
    <div class="value-field">
      <label for="value">YOUR NUMBER</label>
      <input id="value" type="number" inputmode="decimal" step="any" value="2">
    </div>
    <div>
      <label for="a">A · DIVIDE BY</label>
      <input id="a" type="number" inputmode="decimal" step="any" value="341.5">
    </div>
    <div>
      <label for="b">B · MULTIPLY BY</label>
      <input id="b" type="number" inputmode="decimal" step="any" value="856">
    </div>
  </div>
  </section>
</main>
<script>
(() => {
  const ids = ["value", "a", "b"];
  const els = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const fill = document.getElementById("fill");
  const remaining = document.getElementById("remaining");
  const editor = document.getElementById("editor");
  const editToggle = document.getElementById("editToggle");
  const backgroundColor = document.getElementById("backgroundColor");

  function saveSettings() {
    try {
      localStorage.setItem("progress-flight", JSON.stringify({
        value: els.value.value,
        a: els.a.value,
        b: els.b.value,
        background: backgroundColor.value
      }));
    } catch {}
  }

  function update() {
    const v = Number(els.value.value);
    const a = Number(els.a.value);
    const b = Number(els.b.value);
    if (els.value.value.trim() === "" || els.b.value.trim() === "") {
  remaining.textContent = "— km to go";
} else {
const distance = b * (1 - v / a);

  remaining.textContent = Number.isFinite(distance)
    ? `${distance.toLocaleString(undefined, { maximumFractionDigits: 2 })} km to go`
    : "— km to go";
}

    if (![v, a, b].every(Number.isFinite) || a === 0) {
      fill.style.width = "0%";
      saveSettings();
      return;
    }

    const converted = (v / a) * b;
    const rawProgress = b === 0 ? 0 : converted / b;
    const progress = Math.max(0, Math.min(1, rawProgress));
    const pct = progress * 100;

    fill.style.width = `${pct}%`;
    saveSettings();
  }

  try {
    const saved = JSON.parse(localStorage.getItem("progress-flight") || "null");
    if (saved) {
      ids.forEach(id => {
        if (saved[id] !== undefined) els[id].value = saved[id];
      });
      if (saved.background) {
        backgroundColor.value = saved.background;
        document.documentElement.style.setProperty("--widget-bg", saved.background);
      }
    }
  } catch {}

  ids.forEach(id => els[id].addEventListener("input", update));

editToggle.addEventListener("click", () => {
  const isOpen = editor.classList.toggle("open");

  editToggle.textContent = isOpen ? "⌃" : "⌄";
  editToggle.setAttribute("aria-expanded", String(isOpen));
  editToggle.setAttribute("aria-label", isOpen ? "Show less" : "Show more");
  editToggle.setAttribute("title", isOpen ? "Show less" : "Show more");
});

  backgroundColor.addEventListener("input", () => {
    document.documentElement.style.setProperty("--widget-bg", backgroundColor.value);
    saveSettings();
  });

  update();
})();
</script>
</body>
</html>
