<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0d">
<title>Progress Flight</title>
<style>
  :root { color-scheme: dark; --bg:#090a0d; --panel:#12151b; --muted:#8b929e; --line:#343b46; --accent:#e8edf4; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:18px;
    background:radial-gradient(ellipse at 50% 0%, #202631 0%, #101319 42%, var(--bg) 78%);
    color:#f3f5f8; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .widget { width:min(680px,100%); padding:25px 24px 20px; border:1px solid #ffffff18; border-radius:22px;
    background:linear-gradient(145deg,#171b22ed,#0d0f13f2); box-shadow:0 22px 70px #0009; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:23px; }
  .eyebrow { color:#9ca5b2; font-size:11px; letter-spacing:.19em; text-transform:uppercase; }
  .status { font-size:11px; color:#aab3bf; border:1px solid #ffffff20; padding:6px 9px; border-radius:999px; }
  .track-wrap { position:relative; padding:18px 8px 13px; }
  .track { height:5px; background:#353c47; border-radius:99px; position:relative; overflow:visible; }
  .fill { height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#aeb9c8,#f4f6fa); box-shadow:0 0 14px #dce5f455; transition:width .25s ease; }
  .marker { position:absolute; left:0; top:50%; width:15px; height:15px; border:3px solid #0f1217; border-radius:50%; background:#f4f6fa; transform:translate(-50%,-50%); box-shadow:0 0 0 1px #f4f6fa; transition:left .25s ease; }
  .ends { display:flex; justify-content:space-between; align-items:center; margin-top:-3px; }
  .endpoint { width:48px; height:48px; border-radius:50%; background:#e8ebef; color:#11151b; display:grid; place-items:center; box-shadow:0 4px 18px #0006; }
  .endpoint svg { width:25px; height:25px; }
  .plane svg { width:29px; height:29px; }
  .metrics { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:18px 2px 22px; }
  .result { font-size:clamp(28px,6vw,40px); font-weight:650; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
  .percent { color:#b5bfcc; font-size:14px; font-variant-numeric:tabular-nums; }
  .fields { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:10px; }
  label { display:block; color:#aab3bf; font-size:11px; margin:0 0 7px 2px; letter-spacing:.04em; }
  input { width:100%; min-width:0; background:#090c11; border:1px solid #303844; border-radius:11px; color:#f4f6f8;
    padding:12px 11px; font:500 15px ui-monospace,SFMono-Regular,Consolas,monospace; outline:none; }
  input:focus { border-color:#aab8ca; box-shadow:0 0 0 3px #aab8ca20; }
  .formula { color:#858e9b; font-size:11px; line-height:1.5; margin:16px 2px 0; }
  .formula strong { color:#cbd3de; font-weight:550; }
  @media(max-width:430px) { .widget{padding:20px 17px 17px}.fields{grid-template-columns:1fr 1fr}.fields .value-field{grid-column:1/-1}.endpoint{width:43px;height:43px} }
</style>
</head>
<body>
<main class="widget" aria-label="Progress tracker">
  <div class="top">
    <div class="eyebrow">Progress tracker</div>
    <div class="status" id="status">IN FLIGHT</div>
  </div>

  <div class="track-wrap">
    <div class="track" aria-label="Progress">
      <div class="fill" id="fill"></div>
      <div class="marker" id="marker"></div>
    </div>
  </div>
  <div class="ends">
    <div class="endpoint" title="Start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>
      </svg>
    </div>
    <div class="endpoint plane" title="Destination">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.7 11.1 3.1 3.4c-.8-.3-1.5.5-1.1 1.2l3.2 5.1 7.2 2.3-7.2 2.3L2 19.4c-.4.7.3 1.5 1.1 1.2l18.6-7.7c.9-.4.9-1.4 0-1.8Z"/>
      </svg>
    </div>
  </div>

  <div style="height:10px"></div>

  <div class="fields">
    <div class="value-field">
      <label for="value">YOUR NUMBER</label>
      <input id="value" type="number" inputmode="decimal" step="any" value="2">
    </div>
    <div>
      <label for="a">A · DIVIDE BY</label>
      <input id="a" type="number" inputmode="decimal" step="any" value="341.5">
    </div>
    <div>
      <label for="b">B · MULTIPLY BY</label>
      <input id="b" type="number" inputmode="decimal" step="any" value="856">
    </div>
  </div>
  <p class="formula">Calculation: <strong>(your number ÷ A) × B</strong>. The bar shows that result as a fraction of B. Edit any number to update the tracker.</p>
</main>
<script>
(() => {
  const ids = ["value", "a", "b"];
  const els = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const fill = document.getElementById("fill");
  const marker = document.getElementById("marker");
   const status = document.getElementById("status");
  const fmt = n => new Intl.NumberFormat(undefined, {maximumFractionDigits: 2}).format(n);
  function update() {
    const v = Number(els.value.value), a = Number(els.a.value), b = Number(els.b.value);
    if (![v,a,b].every(Number.isFinite) || a === 0) {
      fill.style.width = marker.style.left = "0%";
      status.textContent = "CHECK INPUT";
      return;
    }
    const converted = (v / a) * b;
    const rawProgress = b === 0 ? 0 : converted / b;
    const progress = Math.max(0, Math.min(1, rawProgress));
    const pct = progress * 100;
     fill.style.width = `${pct}%`;
    marker.style.left = `${pct}%`;
    status.textContent = pct >= 100 ? "ARRIVED" : "IN FLIGHT";
    try { localStorage.setItem("progress-flight", JSON.stringify({value:els.value.value,a:els.a.value,b:els.b.value})); } catch {}
  }
  try {
    const saved = JSON.parse(localStorage.getItem("progress-flight") || "null");
    if (saved) ids.forEach(id => { if (saved[id] !== undefined) els[id].value = saved[id]; });
  } catch {}
  ids.forEach(id => els[id].addEventListener("input", update));
  update();
})();
</script>
</body>
</html>
